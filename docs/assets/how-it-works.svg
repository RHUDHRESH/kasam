<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title"><title id="title">Screen to face to pixels to offline verification</title><rect width="1200" height="310" rx="24" fill="#14121A"/><text x="45" y="48" fill="#F4C95D" font-family="Arial" font-size="12" letter-spacing="3">FOUR BEATS. ONE OATH.</text><g font-family="Arial" fill="#F8F4EF"><g transform="translate(45 78)"><rect width="250" height="186" rx="14" fill="#211C29" stroke="#36313F"/><text x="20" y="32" fill="#F4C95D" font-size="12">01 / SCREEN</text><path d="M20 70h18v-16h18v16h18v-16h36v16h18v-16h18v16h36v-16h18" stroke="#F4C95D" stroke-width="3" fill="none"/><text x="20" y="114" font-size="19">A fresh light code.</text><text x="20" y="143" font-size="12" fill="#b6b0be">15 changes per second.</text><text x="20" y="163" font-size="12" fill="#b6b0be">The screen lights your face.</text></g><text x="310" y="166" font-size="24" fill="#F4C95D">→</text><g transform="translate(340 78)"><rect width="250" height="186" rx="14" fill="#211C29" stroke="#36313F"/><text x="20" y="32" fill="#F4C95D" font-size="12">02 / REFLECTION</text><circle cx="124" cy="67" r="24" fill="none" stroke="#F4C95D"/><path d="m115 66 4 0m10 0h4m-17 12q8 5 16 0" fill="none" stroke="#F4C95D"/><text x="20" y="114" font-size="19">The face carries it.</text><text x="20" y="143" font-size="12" fill="#b6b0be">A small brightness change</text><text x="20" y="163" font-size="12" fill="#b6b0be">is recorded in the pixels.</text></g><text x="605" y="166" font-size="24" fill="#F4C95D">→</text><g transform="translate(635 78)"><rect width="250" height="186" rx="14" fill="#211C29" stroke="#36313F"/><text x="20" y="32" fill="#F4C95D" font-size="12">03 / VIDEO</text><rect x="95" y="45" width="62" height="44" rx="7" fill="none" stroke="#F4C95D"/><path d="m117 56 18 11-18 11z" fill="#F4C95D"/><text x="20" y="114" font-size="19">The oath travels.</text><text x="20" y="143" font-size="12" fill="#b6b0be">Test the downloaded copy.</text><text x="20" y="163" font-size="12" fill="#b6b0be">WhatsApp validation is pending.</text></g><text x="900" y="166" font-size="24" fill="#F4C95D">→</text><g transform="translate(930 78)"><rect width="225" height="186" rx="14" fill="#211C29" stroke="#36313F"/><text x="20" y="32" fill="#F4C95D" font-size="12">04 / VERIFY</text><path d="M20 81h65l13-37 13 37h70" fill="none" stroke="#5BC48A" stroke-width="3"/><text x="20" y="114" font-size="19">Follow the timing.</text><text x="20" y="143" font-size="12" fill="#b6b0be">A match finds the code.</text><text x="20" y="163" font-size="12" fill="#b6b0be">A jump reveals an edit.</text></g></g></svg>
