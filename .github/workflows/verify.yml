name: Verify KASAM
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  signal-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install verifier dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js sw.js tools/check.mjs; do node --check "$file"; done
      - name: Check Python syntax
        run: python -m py_compile tools/kasam_check.py
      - name: Run synthetic-frame self-test
        run: python tools/kasam_check.py --selftest
      - name: Run signal parity and asset checks
        run: node tools/check.mjs
